# Konfigurasi Nginx untuk container "web" (SmartCity Attendance).
# Document root WAJIB folder public/ (lihat README). PHP diteruskan ke php-fpm
# container "app" lewat FastCGI. Port 80 container ini dipublikasikan ke host
# dengan docker-compose.yml (APP_BIND_IP:APP_PORT), lalu diproxy oleh
# nginx proxy pbo menuju http://10.1.201.3:8090.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Desain sertifikat maksimal 8 MB (config cert.max_upload_mb) + margin.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Alamat asli pengunjung untuk rate limit dan log. Nginx proxy pbo di
    # depan mengirim X-Real-IP (header tidak datang dari internet secara
    # langsung karena port host dibatasi ke IP LAN). Tanpa ini REMOTE_ADDR
    # berisi IP gateway Docker dan limit per-IP jadi berlaku untuk semua orang.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # File tersembunyi (.env, .git, dst.) tidak boleh diakses.
    location ~ /\. {
        deny all;
    }

    # Front controller: rute pretty URL (mis. /e/slug-event) diarahkan ke index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Proxy di depan mengirim X-Forwarded-Proto: https; header diteruskan
        # otomatis ke PHP (HTTP_X_FORWARDED_PROTO) agar tautan QR Code dan
        # cookie sesi memakai skema yang benar. Selaraskan juga HTTPS untuk
        # skrip yang membacanya langsung.
        fastcgi_param HTTPS $http_x_forwarded_proto;
        # Generate sertifikat massal / ekspor bisa memakan waktu.
        fastcgi_read_timeout 120s;
    }

    # Aset statis: cache 30 hari (sama seperti public/.htaccess).
    location ~* \.(css|js|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
