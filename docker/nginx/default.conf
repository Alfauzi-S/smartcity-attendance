# Konfigurasi Nginx untuk container "web" (SmartCity Attendance).
# Document root WAJIB folder public/ (lihat README). PHP diteruskan ke php-fpm
# container "app" lewat FastCGI. Port 80 container ini dipublikasikan ke host
# dengan docker-compose.yml (APP_BIND_IP:APP_PORT), lalu diproxy oleh
# pbo nginx proxy menuju http://10.1.201.3:8090.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Desain sertifikat maksimal 8 MB (config cert.max_upload_mb) + margin.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # File tersembunyi (.env, .git, dst.) tidak boleh diakses.
    location ~ /\. {
        deny all;
    }

    # Front controller: rute pretty URL (mis. /e/slug-event) diarahkan ke index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Proxy di depan mengirim X-Forwarded-Proto: https; teruskan ke PHP
        # agar tautan QR Code dan cookie sesi memakai skema yang benar.
        fastcgi_param HTTPS $https if_not_empty;
        # Generate sertifikat massal / ekspor bisa memakan waktu.
        fastcgi_read_timeout 120s;
    }

    # Aset statis: cache 30 hari (sama seperti public/.htaccess).
    location ~* \.(css|js|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
