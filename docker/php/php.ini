; Konfigurasi PHP untuk SmartCity Attendance (dipakai container "app").
; php.ini-production sudah aktif; file ini menimpa sebagian nilai saja.

memory_limit = 256M
; Desain sertifikat boleh diunggah sampai cert.max_upload_mb (bawaan 8 MB),
; jadi limit PHP di bawahnya harus lebih besar.
upload_max_filesize = 12M
post_max_size = 14M
max_execution_time = 120

; Sesi disimpan di storage/ (bind mount) supaya pengguna tidak ter-logout
; setiap kali container "app" dibuat ulang.
session.save_path = "/var/www/html/storage/sessions"

; OPCache: kode di-bind mount dari host, jadi file di-stempel ulang
; agar perubahan kode langsung terpakai tanpa restart container.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

expose_php = Off
